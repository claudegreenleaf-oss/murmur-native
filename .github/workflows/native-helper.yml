name: native-helper

on:
  push:
    paths:
      - "native/helper/**"
      - ".github/workflows/native-helper.yml"
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'claudegreenleaf-oss/murmur-native'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/helper
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        working-directory: .
        run: |
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: native/helper/.build
          key: spm-${{ runner.os }}-${{ hashFiles('native/helper/Package.swift') }}-${{ hashFiles('native/helper/Sources/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('native/helper/Package.swift') }}-
            spm-${{ runner.os }}-

      - name: Build (release, arm64)
        run: swift build -c release --arch arm64

      - name: Make app bundle
        run: scripts/make-app.sh

      - name: Import signing identity
        id: identity
        env:
          MURMUR_SIGN_P12: ${{ secrets.MURMUR_SIGN_P12 }}
          MURMUR_SIGN_P12_PASSWORD: ${{ secrets.MURMUR_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MURMUR_SIGN_P12" ]; then
            echo "No MURMUR_SIGN_P12 secret; the app will be ad-hoc signed."
            echo "hash=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/murmur-signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "$MURMUR_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/murmur-id.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/murmur-id.p12" -k "$KC" -P "$MURMUR_SIGN_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$KC"
          HASH="$(security find-identity -p codesigning "$KC" | awk '/Murmur Self-Signed/{print $2; exit}')"
          if [ -z "$HASH" ]; then echo "identity 'Murmur Self-Signed' not found"; exit 1; fi
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "keychain=$KC" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/murmur-id.p12"

      - name: Codesign
        env:
          HASH: ${{ steps.identity.outputs.hash }}
          KC: ${{ steps.identity.outputs.keychain }}
        run: |
          APP="build/Murmur.app"
          DYLIB="$APP/Contents/Resources/MediaRemoteAdapter/libMediaRemoteAdapter.dylib"
          sign() { codesign --force --timestamp=none --sign "$HASH" "$@"; }
          if ! sign "$DYLIB"; then
            if [ "$HASH" != "-" ]; then
              echo "codesign refused the identity; trusting the certificate for code signing"
              security find-certificate -c "Murmur Self-Signed" -p "$KC" > "$RUNNER_TEMP/murmur-cert.pem"
              sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$KC" "$RUNNER_TEMP/murmur-cert.pem" \
                || security add-trusted-cert -r trustRoot -p codeSign -k "$KC" "$RUNNER_TEMP/murmur-cert.pem"
              sign "$DYLIB"
            else
              exit 1
            fi
          fi
          sign --deep "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20

      - name: Zip
        run: |
          rm -f build/MurmurHelper.zip
          ditto -c -k --keepParent "build/Murmur.app" build/MurmurHelper.zip
          ls -la build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: murmur-helper
          path: native/helper/build/MurmurHelper.zip
          if-no-files-found: error
